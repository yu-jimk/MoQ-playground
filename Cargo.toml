[workspace]
resolver = "3"
# 学習の段階ごとに 3 グループへ分けている。
#   quic/         ① 生 QUIC そのもの(stream と datagram)
#   moq/          ② 生 QUIC(moqt://)の上に載る MoQ の pub/sub
#   webtransport/ ③ WebTransport(HTTP/3)の上に載る MoQ(relay + client + web)
members = [
    # ① QUIC の stream と datagram
    "quic/transport",
    "quic/stream",
    "quic/datagram",
    # ② MoQ (生 QUIC 上)
    "moq",
    # ③ WebTransport / HTTP3 上の MoQ
    "webtransport/relay",
    "webtransport/client",
]

# 各クレートで共有するバージョン・依存の定義。
# メンバー側は `foo.workspace = true` で参照する。
[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = ["full"] }
quinn = "0.11.11"
rcgen = "0.14.8"
bytes = "1.10.1"
